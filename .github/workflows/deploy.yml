name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: schedule_app_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, intl, bcmath, dom
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Types and unit tests
        run: |
          npm run check
          npm test

      - name: Build assets
        run: npm run build

      - name: Feature tests
        run: php artisan test

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: public/build
          retention-days: 1

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      APP_PATH: ${{ secrets.APP_PATH }}
      PHP_BIN: ${{ secrets.PHP_BIN || 'php' }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Update code, dependencies and database
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$APP_PATH' && git fetch --prune origin main && git reset --hard origin/main && PHP_BIN='$PHP_BIN' bash scripts/deploy.sh"

      - name: Upload built assets
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" build/ "$SSH_USER@$SSH_HOST:$APP_PATH/public/build/"
